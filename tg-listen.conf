# ──────────────────────────────────────────────────────────────────────────────
# tg-listen.conf — config for `tg-listen` (target side).
#
# Loaded automatically from the working directory.  Pass `-c <file>` to use
# a different one.  Every CLI flag overrides what's set here.
# ──────────────────────────────────────────────────────────────────────────────

# ── Wire-level filters — MUST MATCH tg-scan.conf on the sender side ─────────────
udp_port = 54321
tcp_port = 54322

# ICMP echo identifier filter.  Listener only counts Echo Requests whose
# identifier matches this — keep this in sync with scan.conf.
# Set to 0 to accept ANY identifier (useful for diagnostics; will catch
# regular pings flowing through the host).
icmp_id  = 0x1234

# ── Which protocols to count at all ──────────────────────────────────────────
# Comma-separated: udp,tcp,icmp / all / or any subset.
# Pair this with the sender's protocol choice — running the listener in `all`
# mode while the sender only sends UDP will catch every TCP-SYN / ping that
# happens to hit the box, which is rarely what you want.
protos = all

# ── Live progress / final report ─────────────────────────────────────────────
report = 2.0              # seconds between live updates
top    = 10               # rows to show in throughput live view; 0 = all
output = scan_report.txt  # final report file (written on Ctrl+C)

# ── Kernel receive buffer ────────────────────────────────────────────────────
# Bump higher (e.g. 64 MiB) for very high-rate scans.
rcvbuf = 16777216
