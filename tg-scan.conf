# ──────────────────────────────────────────────────────────────────────────────
# tg-scan.conf — config for `tg-scan` (sender side).
#
# Loaded automatically from the working directory.  Pass `-c <file>` to use
# a different one.  Every CLI flag overrides what's set here.
# ──────────────────────────────────────────────────────────────────────────────

# ── Target (the host running tg-listen) ───────────────────────────────────
target   = 1.2.3.4

# ── Wire-level settings — MUST MATCH tg-listen.conf on the other side ───────────
udp_port = 54321
tcp_port = 54322
icmp_id  = 0x1234

# ── Source IP ranges (discover mode, and throughput if no ips_file) ──────────
# Repeat `range = ...` per CIDR.
range = 5.0.0.0/24
range = 8.8.8.0/24
# range = 1.1.1.0/24

# ── Alternative source list (overrides ranges when set) ──────────────────────
# One IP per line; typically the output of a previous `discover` run.
# ips_file = open_ips.txt

# ── Protocol selection ───────────────────────────────────────────────────────
# Comma-separated: udp,tcp,icmp  or  any subset  or  all
# `discover` uses all listed; `throughput` uses only the first.
protos = udp,tcp,icmp

# ── Throughput-mode knobs ────────────────────────────────────────────────────
packet_size    = 1024     # payload bytes per packet (0..1400)
packets_per_ip = 100      # packets to send from each source IP

# ── Rate limiting ────────────────────────────────────────────────────────────
# 0 = unlimited.  Set realistically — unlimited will saturate every queue
# between you and the target and cause artificial drops.
rate_pps = 2000

# ── Progress reporting ───────────────────────────────────────────────────────
report = 2.0              # seconds between progress lines
